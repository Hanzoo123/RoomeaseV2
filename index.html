<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RoomEase — find and manage boarding houses in Baybay City." />
    <meta name="color-scheme" content="light dark" />
    <!-- Folder the site is served from. index.php replaces it in the built site on WAMP. -->
    <meta name="roomease-base" content="/" />
    <title>RoomEase</title>
    <script>
      // Apply the saved light/dark theme before the app renders to avoid a flash.
      try {
        var saved = localStorage.getItem('roomease.theme')
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light')
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
